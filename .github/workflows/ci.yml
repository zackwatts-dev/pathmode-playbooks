name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Each playbook's pinned packages, checked by hash
        run: for r in */requirements.txt; do pip install --require-hashes -r "$r"; done
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Every playbook runs on its sample data, offline
        run: |
          for f in */*.py; do
            [ "$(basename "$f" .py)" = "$(dirname "$f" | tr - _)" ] || continue  # each folder's main script
            python "$f" --sample --dry-run --out "out/$(dirname "$f")"
          done
